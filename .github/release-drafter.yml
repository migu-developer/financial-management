# release-drafter config — maintains a DRAFT "next release" whose body is the
# changelog of PRs merged since the last release, grouped by label.
#
# Date-based releases (e.g. 2026.07.05.1): we deliberately DO NOT use
# `version-resolver`/`$RESOLVED_VERSION` (semver). Those made release-drafter
# try to semver-parse our date tags and fail ("No changes since last release").
# Without them, release-drafter just drafts the changelog; the concrete date tag
# is set when the draft is published (release-drafter does not compute CalVer).
# Mirrors the working setup in the beefalo repo.
name-template: '🚀 YYYY.MM.DD.#'
tag-template: 'YYYY.MM.DD.#'

categories:
  - title: '🚀 Features'
    labels: ['feat']
  - title: '🐛 Bug Fixes'
    labels: ['fix']
  - title: '♻️ Refactors'
    labels: ['refactor']
  - title: '⚡ Performance'
    labels: ['perf']
  - title: '📚 Documentation'
    labels: ['docs']
  - title: '✅ Tests'
    labels: ['test']
  - title: '🏗️ Build'
    labels: ['build']
  - title: '⚙️ CI/CD'
    labels: ['ci']
  - title: '🧹 Chores'
    labels: ['chore']
  - title: '💅 Styles'
    labels: ['style']
  - title: '⏪ Reverts'
    labels: ['revert']

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
template: |
  ## Changes

  $CHANGES

# Autolabels PRs by branch prefix (feat/ -> feat, ...) so the categories above
# populate automatically. PRs may also be labeled manually.
autolabeler:
  - label: 'feat'
    branch:
      - '/^feat\/.+/'
  - label: 'fix'
    branch:
      - '/^fix\/.+/'
  - label: 'docs'
    branch:
      - '/^docs\/.+/'
  - label: 'chore'
    branch:
      - '/^chore\/.+/'
  - label: 'refactor'
    branch:
      - '/^refactor\/.+/'
  - label: 'test'
    branch:
      - '/^test\/.+/'
  - label: 'perf'
    branch:
      - '/^perf\/.+/'
  - label: 'ci'
    branch:
      - '/^ci\/.+/'
  - label: 'build'
    branch:
      - '/^build\/.+/'
  - label: 'style'
    branch:
      - '/^style\/.+/'
  - label: 'revert'
    branch:
      - '/^revert\/.+/'
