# release-drafter config — maintains a DRAFT "next release" whose body is the
# changelog of PRs merged since the last release, grouped by label.
#
# Date-based releases (e.g. 2026.07.05.1): we deliberately DO NOT use
# `version-resolver`/`$RESOLVED_VERSION` (semver). Those made release-drafter
# try to semver-parse our date tags and fail ("No changes since last release").
# Without them, release-drafter just drafts the changelog; the concrete date tag
# is set when the draft is published (release-drafter does not compute CalVer).
# Mirrors the working setup in the beefalo repo.
name-template: '🚀 YYYY.MM.DD.#'
tag-template: 'YYYY.MM.DD.#'

# PRs with this label are kept out of the drafted changelog.
exclude-labels:
  - 'ignore-for-release'

categories:
  - title: '🚀 Features'
    labels: ['feat']
  - title: '🐛 Bug Fixes'
    labels: ['fix']
  - title: '♻️ Refactors'
    labels: ['refactor']
  - title: '⚡ Performance'
    labels: ['perf']
  - title: '📚 Documentation'
    labels: ['docs']
  - title: '✅ Tests'
    labels: ['test']
  - title: '🏗️ Build'
    labels: ['build']
  - title: '⚙️ CI/CD'
    labels: ['ci']
  - title: '🧹 Chores'
    labels: ['chore']
  - title: '💅 Styles'
    labels: ['style']
  - title: '⏪ Reverts'
    labels: ['revert']

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
template: |
  ## Changes

  $CHANGES

# NOTE: autolabeling is NOT done here. On pull_request_target release-drafter
# always attempts to create a release (there is no autolabel-only flag), which
# needs contents: write — too broad for PR-target runs. Instead a small `gh`
# step in .github/workflows/release-drafter.yml applies the branch-prefix label.
