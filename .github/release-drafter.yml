# release-drafter is used ONLY as a PR autolabeler here.
#
# Release NOTES are generated by GitHub natively (.github/release.yml) because
# our releases use date-based tags (e.g. 2026.07.05.1), which release-drafter —
# being semver-centric — cannot sort or diff, so its drafter produced empty
# "No changes since last release" notes. The drafter is disabled via
# `disable-releaser: true` in .github/workflows/release-drafter.yml; the config
# below only drives autolabeling (branch prefix -> label), which in turn feeds
# the label categories in .github/release.yml.
autolabeler:
  - label: 'feat'
    branch:
      - '/^feat\/.+/'
  - label: 'fix'
    branch:
      - '/^fix\/.+/'
  - label: 'docs'
    branch:
      - '/^docs\/.+/'
  - label: 'chore'
    branch:
      - '/^chore\/.+/'
  - label: 'refactor'
    branch:
      - '/^refactor\/.+/'
  - label: 'test'
    branch:
      - '/^test\/.+/'
  - label: 'perf'
    branch:
      - '/^perf\/.+/'
  - label: 'ci'
    branch:
      - '/^ci\/.+/'
  - label: 'build'
    branch:
      - '/^build\/.+/'
  - label: 'style'
    branch:
      - '/^style\/.+/'
  - label: 'revert'
    branch:
      - '/^revert\/.+/'
