name: Release Drafter

# Maintains a DRAFT "next release" whose body is the changelog of PRs merged
# since the last release (see .github/release-drafter.yml).
#
# Split into two jobs so pull_request_target (which handles untrusted PR head
# refs) never gets `contents: write`:
#   - draft         : PR events -> autolabel only (pull-requests: write).
#                     Named "Draft release" because that is the branch-protection
#                     ruleset's required status check — do NOT rename without
#                     updating the ruleset context in lockstep.
#   - update-draft  : push to main / manual -> refresh the draft (contents: write).
#
# No paths-ignore on push: every merge to main refreshes the draft so any PR
# (docs included) lands in the changelog.
#
# Date-based releases: the config avoids semver version-resolver, so
# release-drafter drafts the changelog and the concrete date tag is set at
# publish time (release-drafter has no native CalVer).

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-drafter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft:
    name: Draft release
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # SHA-pinned (v7.2.1) — runs on pull_request_target, so keep it locked.
      - uses: release-drafter/release-drafter@563bf132657a13ded0b01fcb723c5a58cdd824e2 # v7.2.1
        with:
          config-name: release-drafter.yml
          disable-releaser: true # PR runs only autolabel; no release writes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-draft:
    name: Update draft release
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@563bf132657a13ded0b01fcb723c5a58cdd824e2 # v7.2.1
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
