name: PR Autolabeler

# Autolabels PRs by branch prefix (feat/ -> feat, fix/ -> fix, ...) using
# release-drafter's autolabeler ONLY. Release NOTES are generated natively by
# GitHub from .github/release.yml (our releases use date-based tags, which
# release-drafter's semver drafter cannot handle) — so the drafter is disabled
# here via `disable-releaser: true`.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-autolabeler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autolabel:
    name: Autolabel PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to a full commit SHA (not a mutable tag) to reduce supply-chain
      # risk: this runs on pull_request_target with `pull-requests: write`.
      # SHA below is release-drafter v7.2.1.
      - uses: release-drafter/release-drafter@563bf132657a13ded0b01fcb723c5a58cdd824e2 # v7.2.1
        with:
          config-name: release-drafter.yml
          disable-releaser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
