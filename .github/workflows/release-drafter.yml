name: Release Drafter

# This workflow now ONLY autolabels PRs (branch prefix -> label) via
# release-drafter's autolabeler; the release drafter/releaser is disabled
# (`disable-releaser: true`) because release NOTES are generated natively by
# GitHub from .github/release.yml (our date-based tags break release-drafter's
# semver drafter).
#
# NOTE: the workflow name ("Release Drafter") and job name ("Draft release")
# are intentionally KEPT so the existing branch-protection ruleset required
# status check "Draft release" keeps being produced. Renaming them would
# require updating the ruleset context in lockstep, so we don't.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: release-drafter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to a full commit SHA (not a mutable tag) to reduce supply-chain
      # risk: this runs on pull_request_target with `pull-requests: write`.
      # SHA below is release-drafter v7.2.1.
      - uses: release-drafter/release-drafter@563bf132657a13ded0b01fcb723c5a58cdd824e2 # v7.2.1
        with:
          config-name: release-drafter.yml
          disable-releaser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
